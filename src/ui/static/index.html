<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAGE — Live Dashboard</title>
<style>
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #21262d;
  --border: #30363d;
  --text: #c9d1d9;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --yellow: #d29922;
  --red: #f85149;
  --orange: #e3b341;
  --purple: #bc8cff;
  --panel-gap: 8px;
  --radius: 6px;
  --font: 'Segoe UI', system-ui, sans-serif;
  --mono: 'Cascadia Code', 'Consolas', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* ---- Header ---- */
#header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 8px 14px; display: flex; align-items: center; gap: 12px; min-height: 44px; flex-shrink: 0; }
#header h1 { font-size: 15px; font-weight: 600; color: var(--accent); letter-spacing: 0.5px; }
.badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.badge-green { background: #1b4332; color: var(--green); }
.badge-red   { background: #3d1215; color: var(--red); }
.badge-dim   { background: var(--bg3); color: var(--text-dim); }
#ws-status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
#ws-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); transition: background 0.3s; }
#ws-dot.connected { background: var(--green); }
#token-hint { font-size: 11px; color: var(--text-dim); margin-left: 6px; }

/* ---- Main layout ---- */
#main { display: grid; grid-template-columns: 220px 1fr 320px; grid-template-rows: 1fr; flex: 1; overflow: hidden; gap: var(--panel-gap); padding: var(--panel-gap); }

/* ---- Shared panel styles ---- */
.panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
.panel-title { padding: 8px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
.panel-title .count { background: var(--bg3); color: var(--text-dim); border-radius: 999px; padding: 1px 7px; font-size: 10px; }
.panel-body { flex: 1; overflow-y: auto; padding: 8px; }
.panel-body::-webkit-scrollbar { width: 4px; } 
.panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ---- Left: Task History ---- */
#left { grid-column: 1; display: flex; flex-direction: column; gap: var(--panel-gap); }
.task-item { padding: 8px 10px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; transition: background 0.1s; }
.task-item:hover { background: var(--bg3); }
.task-item.active { border-color: var(--accent); background: #1c2a3a; }
.task-title { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-meta { font-size: 10px; color: var(--text-dim); margin-top: 2px; display: flex; gap: 6px; }
.task-state { font-size: 10px; font-weight: 600; }
.state-SUBMITTED { color: var(--text-dim); }
.state-PLANNING { color: var(--yellow); }
.state-EXECUTING { color: var(--accent); }
.state-AWAITING_APPROVAL { color: var(--orange); }
.state-COMPLETED { color: var(--green); }
.state-FAILED { color: var(--red); }
.state-CANCELLED { color: var(--text-dim); }

/* ---- Center ---- */
#center { grid-column: 2; display: flex; flex-direction: column; gap: var(--panel-gap); }

/* Chat panel */
#chat-panel { flex: 1; }
#chat-msgs { display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 8px; }
.msg-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.msg-user .msg-avatar { background: #1f4068; color: var(--accent); }
.msg-friday .msg-avatar { background: #1a3a1a; color: var(--green); }
.msg-system .msg-avatar { background: var(--bg3); color: var(--text-dim); }
.msg-bubble { background: var(--bg3); border-radius: 4px; padding: 8px 10px; line-height: 1.5; max-width: 100%; word-break: break-word; }
.msg-user .msg-bubble { background: #1c2a3a; }
.msg-system .msg-bubble { background: transparent; border: 1px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
.msg-time { font-size: 10px; color: var(--text-dim); margin-top: 3px; }
.typing { color: var(--text-dim); font-style: italic; font-size: 12px; }

/* Chat input */
#chat-input-area { padding: 8px; border-top: 1px solid var(--border); display: flex; gap: 6px; flex-shrink: 0; }
#chat-input { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 7px 10px; font-size: 13px; font-family: var(--font); resize: none; outline: none; min-height: 36px; max-height: 120px; }
#chat-input:focus { border-color: var(--accent); }
#send-btn { background: var(--accent); color: #0d1117; border: none; border-radius: 4px; padding: 0 14px; font-weight: 700; cursor: pointer; font-size: 13px; }
#send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Task submit bar */
#task-bar { padding: 8px; border-top: 1px solid var(--border); display: flex; gap: 6px; flex-shrink: 0; background: var(--bg2); }
#task-input { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 6px 10px; font-size: 12px; font-family: var(--font); outline: none; }
#task-input:focus { border-color: var(--yellow); }
#task-submit-btn { background: var(--yellow); color: #0d1117; border: none; border-radius: 4px; padding: 0 12px; font-weight: 700; cursor: pointer; font-size: 12px; }
#task-submit-btn:disabled { opacity: 0.4; }

/* ---- Right ---- */
#right { grid-column: 3; display: flex; flex-direction: column; gap: var(--panel-gap); }

/* Execution plan */
#plan-panel { flex: 1; }
.step-item { padding: 6px 8px; border-radius: 4px; margin-bottom: 4px; border-left: 3px solid var(--border); display: flex; gap: 8px; align-items: flex-start; }
.step-item.PENDING  { border-color: var(--border); }
.step-item.RUNNING  { border-color: var(--accent); background: #1c2a3a22; }
.step-item.COMPLETED { border-color: var(--green); }
.step-item.FAILED   { border-color: var(--red); }
.step-item.SKIPPED  { border-color: var(--text-dim); opacity: 0.6; }
.step-item.AWAITING_APPROVAL { border-color: var(--orange); }
.step-icon { font-size: 12px; flex-shrink: 0; margin-top: 1px; }
.step-name { font-size: 12px; font-weight: 500; }
.step-tool { font-size: 10px; color: var(--text-dim); font-family: var(--mono); }

/* Activity feed */
#activity-panel { height: 220px; }
.event-row { display: flex; gap: 8px; padding: 3px 4px; border-radius: 3px; font-size: 11px; font-family: var(--mono); }
.event-row:hover { background: var(--bg3); }
.event-time { color: var(--text-dim); flex-shrink: 0; min-width: 50px; }
.event-type { flex-shrink: 0; min-width: 80px; font-weight: 600; }
.event-msg { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.et-task { color: var(--accent); }
.et-step { color: var(--purple); }
.et-tool { color: var(--yellow); }
.et-approval { color: var(--orange); }
.et-runtime { color: var(--green); }
.et-chat { color: var(--text-dim); }

/* Approvals */
#approval-panel { flex-shrink: 0; }
.approval-item { padding: 8px; border-radius: 4px; border: 1px solid var(--orange); background: #2a1a0a; margin-bottom: 6px; }
.approval-action { font-size: 12px; font-weight: 600; color: var(--orange); }
.approval-params { font-size: 10px; color: var(--text-dim); font-family: var(--mono); margin: 3px 0; }
.approval-btns { display: flex; gap: 6px; margin-top: 6px; }
.btn-approve { background: var(--green); color: #0d1117; border: none; border-radius: 3px; padding: 3px 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
.btn-reject  { background: var(--red);   color: #fff;    border: none; border-radius: 3px; padding: 3px 10px; font-size: 11px; font-weight: 700; cursor: pointer; }

/* System status */
#status-panel { flex-shrink: 0; }
.status-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.status-row:last-child { border-bottom: none; }
.status-label { color: var(--text-dim); }
.status-ok   { color: var(--green); font-weight: 600; }
.status-err  { color: var(--red);   font-weight: 600; }
.status-warn { color: var(--yellow); font-weight: 600; }

/* scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

/* empty state */
.empty { color: var(--text-dim); font-size: 12px; padding: 16px; text-align: center; font-style: italic; }

/* panel action buttons in title */
.panel-title button { margin-left: auto; background: var(--bg3); border: 1px solid var(--border); color: var(--text-dim); font-size: 10px; padding: 2px 7px; border-radius: 3px; cursor: pointer; }
.panel-title button:hover { color: var(--text); }
</style>
</head>
<body>
<div id="header">
  <h1>⚡ SAGE</h1>
  <span id="runtime-badge" class="badge badge-dim">Connecting…</span>
  <span id="model-badge" class="badge badge-dim" style="display:none">Model</span>
  <div id="ws-status">
    <div id="ws-dot"></div>
    <span id="ws-label">Offline</span>
  </div>
</div>

<div id="main">
  <!-- LEFT: Task history + Submit bar -->
  <div id="left">
    <div class="panel" style="flex:1">
      <div class="panel-title">📋 Tasks <span class="count" id="task-count">0</span>
        <button onclick="loadTasks()">↻</button>
      </div>
      <div class="panel-body" id="task-list"><div class="empty">No tasks yet</div></div>
    </div>
  </div>

  <!-- CENTER: Chat -->
  <div id="center">
    <div class="panel" id="chat-panel">
      <div class="panel-title">💬 Friday Agent & Conversation</div>
      <div class="panel-body" id="chat-msgs"></div>
      <div id="chat-input-area">
        <textarea id="chat-input" placeholder="Message Friday… (e.g. 'Explain transformers', 'List files in workspace', 'What are you doing?') — Enter to send" rows="1"></textarea>
        <button id="send-btn" onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>

  <!-- RIGHT: Plan, Activity, Approvals, Status -->
  <div id="right">
    <div class="panel" id="plan-panel">
      <div class="panel-title">🗺 Execution Plan <span id="plan-task-title" style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-dim);font-size:10px;margin-left:4px;"></span></div>
      <div class="panel-body" id="plan-steps"><div class="empty">Select a task to see its steps</div></div>
    </div>
    <div class="panel" id="activity-panel">
      <div class="panel-title">📡 Live Activity
        <button onclick="clearActivity()">Clear</button>
        <button id="scroll-lock-btn" onclick="toggleScrollLock()" style="margin-left:4px">🔒 Lock</button>
      </div>
      <div class="panel-body" id="activity-feed"></div>
    </div>
    <div class="panel" id="approval-panel">
      <div class="panel-title">🔐 Approvals <span class="count" id="approval-count">0</span>
        <button onclick="loadApprovals()">↻</button>
      </div>
      <div class="panel-body" id="approval-list"><div class="empty">No pending approvals</div></div>
    </div>
    <div class="panel" id="status-panel">
      <div class="panel-title">🖥 System Status</div>
      <div class="panel-body" id="status-body">
        <div class="empty">Loading…</div>
      </div>
    </div>
  </div>
</div>

<script>
// ---- Config ----
const TOKEN = new URLSearchParams(window.location.search).get('token') || '';
const API = (path) => `${path}${path.includes('?') ? '&' : '?'}token=${TOKEN}`;
const WS_URL = `ws://${location.host}/ws?token=${TOKEN}`;

// ---- State ----
let eventSource = null;
let activeTaskId = null;
let scrollLocked = false;

// ---- Live Event Streaming (Server-Sent Events) ----
function connect() {
  if (eventSource) { eventSource.close(); }
  try {
    eventSource = new EventSource(API('/api/events'));

    eventSource.onopen = () => {
      document.getElementById('ws-dot').classList.add('connected');
      document.getElementById('ws-label').textContent = 'Live';
      loadStatus(); loadTasks(); loadApprovals();
    };

    eventSource.onmessage = (e) => {
      try {
        const ev = JSON.parse(e.data);
        handleEvent(ev);
      } catch {}
    };

    eventSource.onerror = () => {
      document.getElementById('ws-dot').classList.remove('connected');
      document.getElementById('ws-label').textContent = 'Reconnecting…';
    };
  } catch (err) {
    console.error('SSE connect error', err);
  }
}

function handleEvent(ev) {
  appendActivity(ev);

  const t = ev.event_type || '';
  if (t.startsWith('task.') || t.startsWith('step.') || t.startsWith('approval.') || t === 'runtime.started') {
    loadStatus();
  }
  if (t.startsWith('task.')) loadTasks();
  if (t.startsWith('approval.')) loadApprovals();
  if (t === 'task.started' || t === 'task.planned' || t === 'step.started' || t === 'step.completed') {
    if (ev.task_id === activeTaskId) loadTaskDetail(activeTaskId);
  }
  if (t === 'runtime.started') {
    document.getElementById('runtime-badge').className = 'badge badge-green';
    document.getElementById('runtime-badge').textContent = 'Running';
  }
}

// ---- Activity Feed ----
function appendActivity(ev) {
  const feed = document.getElementById('activity-feed');
  const t = ev.event_type || '';

  let cls = 'et-runtime';
  if (t.startsWith('task.')) cls = 'et-task';
  else if (t.startsWith('step.')) cls = 'et-step';
  else if (t.startsWith('tool.')) cls = 'et-tool';
  else if (t.startsWith('approval.')) cls = 'et-approval';
  else if (t.startsWith('chat.')) cls = 'et-chat';

  const ts = ev.timestamp ? ev.timestamp.substring(11, 19) : '';
  const shortType = t.split('.').pop() || t;

  const row = document.createElement('div');
  row.className = 'event-row';
  row.innerHTML = `<span class="event-time">${ts}</span><span class="event-type ${cls}">${shortType}</span><span class="event-msg" title="${esc(ev.message || '')}">${esc(ev.message || '')}</span>`;
  feed.appendChild(row);

  if (!scrollLocked) feed.scrollTop = feed.scrollHeight;
}

function clearActivity() {
  document.getElementById('activity-feed').innerHTML = '';
}

function toggleScrollLock() {
  scrollLocked = !scrollLocked;
  document.getElementById('scroll-lock-btn').textContent = scrollLocked ? '🔓 Unlock' : '🔒 Lock';
}

// ---- API helpers ----
async function apiFetch(path, opts = {}) {
  const headers = { 'X-SAGE-Token': TOKEN, 'Content-Type': 'application/json', ...(opts.headers || {}) };
  const r = await fetch(path, { ...opts, headers });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

// ---- Chat ----
function addChatMsg(role, text) {
  const msgs = document.getElementById('chat-msgs');
  const avatars = { user: 'U', friday: 'F', system: '⚙' };
  const labels = { user: 'You', friday: 'Friday', system: 'System' };
  const div = document.createElement('div');
  div.className = `msg msg-${role}`;
  const ts = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  div.innerHTML = `
    <div class="msg-avatar">${avatars[role] || '?'}</div>
    <div>
      <div class="msg-bubble">${esc(text).replace(/\n/g, '<br>')}</div>
      <div class="msg-time">${labels[role] || role} · ${ts}</div>
    </div>`;
  msgs.appendChild(div);
  msgs.parentElement.scrollTop = msgs.parentElement.scrollHeight;
  return div;
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = '';
  addChatMsg('user', text);
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  const typingDiv = addChatMsg('friday', '…');
  typingDiv.querySelector('.msg-bubble').classList.add('typing');
  try {
    const res = await apiFetch('/api/chat', { method: 'POST', body: JSON.stringify({ message: text }) });
    typingDiv.querySelector('.msg-bubble').textContent = res.reply || '(no reply)';
    typingDiv.querySelector('.msg-bubble').classList.remove('typing');
  } catch (e) {
    typingDiv.querySelector('.msg-bubble').textContent = `Error: ${e.message}`;
    typingDiv.querySelector('.msg-bubble').classList.remove('typing');
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('chat-input');
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
  });
  loadStatus();
  loadTasks();
  loadApprovals();
  connect();
  setInterval(() => {
    loadStatus();
    loadTasks();
    loadApprovals();
  }, 5000);
});

// ---- Tasks ----
async function loadTasks() {
  try {
    const res = await apiFetch('/api/tasks');
    const tasks = res.tasks || [];
    document.getElementById('task-count').textContent = tasks.length;
    const list = document.getElementById('task-list');
    if (!tasks.length) { list.innerHTML = '<div class="empty">No tasks yet</div>'; return; }
    list.innerHTML = '';
    tasks.slice(0, 100).forEach(t => {
      const div = document.createElement('div');
      div.className = 'task-item' + (t.task_id === activeTaskId ? ' active' : '');
      div.dataset.id = t.task_id;
      const ts = t.created_at ? t.created_at.substring(0, 16).replace('T', ' ') : '';
      div.innerHTML = `
        <div class="task-title" title="${esc(t.title)}">${esc(t.title)}</div>
        <div class="task-meta">
          <span class="task-state state-${t.state}">${t.state}</span>
          <span>${ts}</span>
        </div>`;
      div.onclick = () => selectTask(t.task_id);
      list.appendChild(div);
    });
  } catch (e) { console.error('loadTasks', e); }
}

function selectTask(taskId) {
  activeTaskId = taskId;
  document.querySelectorAll('.task-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === taskId);
  });
  loadTaskDetail(taskId);
}

async function loadTaskDetail(taskId) {
  try {
    const res = await apiFetch(`/api/task/${taskId}`);
    const steps = res.steps || [];
    const task = res.task || {};
    document.getElementById('plan-task-title').textContent = task.title ? `— ${task.title}` : '';
    const panel = document.getElementById('plan-steps');
    if (!steps.length) { panel.innerHTML = '<div class="empty">No steps yet</div>'; return; }
    const icons = { PENDING: '○', RUNNING: '●', COMPLETED: '✓', FAILED: '✗', SKIPPED: '—', AWAITING_APPROVAL: '⚠' };
    panel.innerHTML = '';
    steps.forEach(s => {
      const div = document.createElement('div');
      div.className = `step-item ${s.state || 'PENDING'}`;
      div.innerHTML = `
        <span class="step-icon">${icons[s.state] || '○'}</span>
        <div>
          <div class="step-name">${esc(s.name || s.step_id)}</div>
          ${s.tool_name ? `<div class="step-tool">${esc(s.tool_name)}</div>` : ''}
          ${s.output_summary ? `<div class="step-tool" style="color:var(--text-dim)">${esc(s.output_summary)}</div>` : ''}
        </div>`;
      panel.appendChild(div);
    });
  } catch (e) { console.error('loadTaskDetail', e); }
}

async function submitTask() {
  const inp = document.getElementById('task-input');
  const title = inp.value.trim();
  if (!title) return;
  inp.value = '';
  document.getElementById('task-submit-btn').disabled = true;
  try {
    const res = await apiFetch('/api/task', { method: 'POST', body: JSON.stringify({ title }) });
    addChatMsg('system', `Task created: ${res.task_id}\nStatus: ${res.status}`);
    await loadTasks();
    selectTask(res.task_id);
  } catch (e) {
    addChatMsg('system', `Failed to submit task: ${e.message}`);
  } finally {
    document.getElementById('task-submit-btn').disabled = false;
  }
}

// ---- Approvals ----
async function loadApprovals() {
  try {
    const res = await apiFetch('/api/approvals');
    const approvals = res.approvals || [];
    document.getElementById('approval-count').textContent = approvals.length;
    const list = document.getElementById('approval-list');
    if (!approvals.length) { list.innerHTML = '<div class="empty">No pending approvals</div>'; return; }
    list.innerHTML = '';
    approvals.forEach(a => {
      const div = document.createElement('div');
      div.className = 'approval-item';
      div.innerHTML = `
        <div class="approval-action">⚠ ${esc(a.action_name)} [${esc(a.action_risk_level)}]</div>
        <div class="approval-params">Resource: ${esc(a.target_resource)}</div>
        <div class="approval-params">${esc(a.parameters_summary)}</div>
        <div class="approval-btns">
          <button class="btn-approve" onclick="decide('${a.request_id}','approve')">✓ Approve</button>
          <button class="btn-reject"  onclick="decide('${a.request_id}','reject')">✗ Reject</button>
        </div>`;
      list.appendChild(div);
    });
  } catch (e) { console.error('loadApprovals', e); }
}

async function decide(reqId, action) {
  try {
    await apiFetch(`/api/approval/${reqId}/${action}`, { method: 'POST', body: JSON.stringify({ actor: 'ui-user' }) });
    await loadApprovals();
  } catch (e) {
    addChatMsg('system', `Approval ${action} failed: ${e.message}`);
  }
}

// ---- Status ----
async function loadStatus() {
  try {
    const res = await apiFetch('/api/status');
    const badge = document.getElementById('runtime-badge');
    badge.textContent = res.runtime || 'unknown';
    badge.className = 'badge ' + (res.runtime === 'running' ? 'badge-green' : 'badge-red');

    const body = document.getElementById('status-body');
    const comps = res.components || {};
    body.innerHTML = `
      <div class="status-row"><span class="status-label">Runtime</span><span class="status-${res.runtime === 'running' ? 'ok' : 'err'}">${res.runtime || '?'}</span></div>
      ${Object.entries(comps).map(([k, v]) =>
        `<div class="status-row"><span class="status-label">${esc(k)}</span><span class="status-${v === 'ok' ? 'ok' : v === 'unavailable' ? 'warn' : 'err'}">${esc(v)}</span></div>`
      ).join('')}`;
  } catch (e) { console.error('loadStatus', e); }
}

// ---- Util ----
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
